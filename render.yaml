services:
  - type: web
    name: team-task-manager-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: JWT_SECRET
        value: mySecretKey123456789012345678901234567890
      - key: NODE_ENV
        value: production

  - type: web
    name: team-task-manager-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://team-task-manager-backend.onrender.com/api

databases:
  - name: task-manager-db
    databaseName: taskmanager
    user: taskmanager
